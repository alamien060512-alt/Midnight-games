
respawn-delay: 5            
invulnerable-seconds: 3     
base-radius: 20             
no-build-radius: 3          
tnt-fuse-ticks: 40          
fireball-yield: 2.0
magic-milk-seconds: 30        
dream-defender-seconds: 180  
bridge-egg-ticks: 50         
popup-tower-height: 5
hologram:                    
  enabled: true
  types: [diamond, emerald]
  height: 2.4
blast-proof: [GLASS, _STAINED_GLASS, END_STONE]
armor-tiers: [LEATHER, CHAINMAIL, IRON, DIAMOND]   # leggings + boots upgrade through these tiers

start-items:
  - {material: WOODEN_SWORD, unbreakable: true}


generators:
  iron:    {material: IRON_INGOT, intervals: [1.5], amount: 1, max-stack: 48}
  gold:    {material: GOLD_INGOT, intervals: [6.0], amount: 1, max-stack: 16}
  diamond: {material: DIAMOND, intervals: [30, 23, 12], amount: 1, max-stack: 8}
  emerald: {material: EMERALD, intervals: [65, 50, 30], amount: 1, max-stack: 4}


events:
  - {time: 360,  action: diamond-tier, value: 2, name: "Diamond II", message: "<aqua>Diamond generators upgraded to <bold>Tier II<reset><aqua>!"}
  - {time: 720,  action: emerald-tier, value: 2, name: "Emerald II", message: "<green>Emerald generators upgraded to <bold>Tier II<reset><green>!"}
  - {time: 1080, action: diamond-tier, value: 3, name: "Diamond III", message: "<aqua>Diamond generators upgraded to <bold>Tier III<reset><aqua>!"}
  - {time: 1440, action: emerald-tier, value: 3, name: "Emerald III", message: "<green>Emerald generators upgraded to <bold>Tier III<reset><green>!"}
  - {time: 1800, action: destroy-beds, name: "Bed Gone", message: "<red><bold>All beds were destroyed!"}
  - {time: 2400, action: end-game, name: "Game End", message: "<red>Time ran out!"}


lucky:
  block: SPONGE
  interval: 30
loot:
  lucky:
    rolls: 2-3
    items:
      - {material: IRON_INGOT, amount: 8-16, weight: 20}
      - {material: GOLD_INGOT, amount: 4-8, weight: 14}
      - {material: DIAMOND, amount: 1-3, weight: 6}
      - {material: EMERALD, amount: 1-2, weight: 3}
      - {material: TNT, amount: 2-4, weight: 8}
      - {material: FIRE_CHARGE, amount: 1-2, weight: 6}
      - {material: GOLDEN_APPLE, amount: 1-2, weight: 8}
      - {material: ENDER_PEARL, amount: 1, weight: 3}
      - {material: DIAMOND_SWORD, amount: 1, weight: 1}
      - {material: OBSIDIAN, amount: 4-8, weight: 4}

scoreboard:
  team-line: "{color}{letter} <white>{name}<gray>: {status}{you}"
  status-bed: "<green>✔"
  status-count: "<yellow>{count}"
  status-dead: "<red>✘"
  you: " <gray>YOU"

# Build limits: set the arena's "bounds" region (/minigame arena setregion bedwars <arena> bounds) and players can only place
# blocks inside it. build-max-y adds a height limit (0 = none).
build-max-y: 0

# Chests: ender chests open a personal chest; normal chests placed within team-radius blocks of your team spawn open the
# team's shared chest (other teams cannot open it). Chests elsewhere on the map are normal chests.
chests:
  ender-chest: true
  team-chest: true
  team-radius: 12
  place-radius: 12      # chests can only be placed this close to your own team spawn (your island)

fireball-boost: 0.8          # extra knockback of a fireball explosion for fireball jumps (0 = vanilla only)
fireball-boost-radius: 3.5

shop-look-at-player: true   # shop villagers turn to face the nearest player
shop-look-range: 10         # blocks

shop:
  title: "<dark_gray>Item Shop"
  quick-buy:             
    enabled: true
    slot: 8
    default: [wool, stone-sword, chain, iron-pick, bow, speed, gapple, tnt, pearl, water]
  categories:
    - id: blocks
      slot: 0
      material: TERRACOTTA
      name: "<yellow>Blocks"
      items:
        - {id: wool, material: "{color}_WOOL", amount: 16, cost: {iron: 4}, name: "<white>Wool"}
        - {id: clay, material: "{color}_TERRACOTTA", amount: 16, cost: {iron: 12}, name: "<white>Hardened Clay"}
        - {id: glass, material: "{color}_STAINED_GLASS", amount: 4, cost: {iron: 12}, name: "<white>Blast-Proof Glass"}
        - {id: endstone, material: END_STONE, amount: 12, cost: {iron: 24}, name: "<white>End Stone"}
        - {id: ladder, material: LADDER, amount: 16, cost: {iron: 4}, name: "<white>Ladder"}
        - {id: planks, material: OAK_PLANKS, amount: 16, cost: {gold: 4}, name: "<white>Wood"}
        - {id: obsidian, material: OBSIDIAN, amount: 4, cost: {emerald: 4}, name: "<white>Obsidian"}
    - id: melee
      slot: 1
      material: GOLDEN_SWORD
      name: "<yellow>Melee"
      items:
        - {id: stone-sword, material: STONE_SWORD, unbreakable: true, cost: {iron: 10}, name: "<white>Stone Sword"}
        - {id: iron-sword, material: IRON_SWORD, unbreakable: true, cost: {gold: 7}, name: "<white>Iron Sword"}
        - {id: diamond-sword, material: DIAMOND_SWORD, unbreakable: true, cost: {emerald: 4}, name: "<white>Diamond Sword"}
        - {id: kb-stick, material: STICK, enchants: {knockback: 1}, cost: {gold: 5}, name: "<white>Knockback Stick"}
    - id: armor
      slot: 2
      material: CHAINMAIL_BOOTS
      name: "<yellow>Armor"
      items:
        - {id: chain, material: CHAINMAIL_BOOTS, type: armor, tier: 1, cost: {iron: 40}, name: "<white>Chainmail Armor"}
        - {id: iron, material: IRON_BOOTS, type: armor, tier: 2, cost: {gold: 12}, name: "<white>Iron Armor"}
        - {id: diamond, material: DIAMOND_BOOTS, type: armor, tier: 3, cost: {emerald: 6}, name: "<white>Diamond Armor"}
    - id: tools
      slot: 3
      material: STONE_PICKAXE
      name: "<yellow>Tools"
      items:
        - {id: shears, material: SHEARS, unbreakable: true, cost: {iron: 20}, name: "<white>Shears"}
        - {id: wood-pick, material: WOODEN_PICKAXE, type: tool, tool: pickaxe, tier: 1, unbreakable: true, enchants: {efficiency: 1}, cost: {iron: 10}, name: "<white>Wooden Pickaxe", lore: ["<gray>Tier 1. Lose one tier when you die."]}
        - {id: iron-pick, material: IRON_PICKAXE, type: tool, tool: pickaxe, tier: 2, unbreakable: true, enchants: {efficiency: 2}, cost: {gold: 3}, name: "<white>Iron Pickaxe", lore: ["<gray>Tier 2."]}
        - {id: gold-pick, material: GOLDEN_PICKAXE, type: tool, tool: pickaxe, tier: 3, unbreakable: true, enchants: {efficiency: 3}, cost: {gold: 3}, name: "<white>Golden Pickaxe", lore: ["<gray>Tier 3."]}
        - {id: diamond-pick, material: DIAMOND_PICKAXE, type: tool, tool: pickaxe, tier: 4, unbreakable: true, enchants: {efficiency: 3}, cost: {gold: 6}, name: "<white>Diamond Pickaxe", lore: ["<gray>Tier 4."]}
        - {id: wood-axe, material: WOODEN_AXE, type: tool, tool: axe, tier: 1, unbreakable: true, enchants: {efficiency: 1}, cost: {iron: 10}, name: "<white>Wooden Axe", lore: ["<gray>Tier 1. Lose one tier when you die."]}
        - {id: stone-axe, material: STONE_AXE, type: tool, tool: axe, tier: 2, unbreakable: true, enchants: {efficiency: 1}, cost: {iron: 10}, name: "<white>Stone Axe", lore: ["<gray>Tier 2."]}
        - {id: iron-axe, material: IRON_AXE, type: tool, tool: axe, tier: 3, unbreakable: true, enchants: {efficiency: 2}, cost: {gold: 3}, name: "<white>Iron Axe", lore: ["<gray>Tier 3."]}
        - {id: diamond-axe, material: DIAMOND_AXE, type: tool, tool: axe, tier: 4, unbreakable: true, enchants: {efficiency: 3}, cost: {gold: 6}, name: "<white>Diamond Axe", lore: ["<gray>Tier 4."]}
    - id: ranged
      slot: 4
      material: BOW
      name: "<yellow>Ranged"
      items:
        - {id: arrows, material: ARROW, amount: 8, cost: {gold: 2}, name: "<white>Arrows"}
        - {id: bow, material: BOW, unbreakable: true, cost: {gold: 12}, name: "<white>Bow"}
        - {id: bow-power, material: BOW, unbreakable: true, enchants: {power: 1}, cost: {gold: 24}, name: "<white>Bow (Power I)"}
        - {id: bow-punch, material: BOW, unbreakable: true, enchants: {power: 1, punch: 1}, cost: {emerald: 6}, name: "<white>Bow (Power I, Punch I)"}
    - id: potions
      slot: 5
      material: BREWING_STAND
      name: "<yellow>Potions"
      items:
        - {id: speed, material: POTION, potion: swiftness, cost: {emerald: 1}, name: "<white>Speed Potion"}
        - {id: jump, material: POTION, potion: leaping, cost: {emerald: 1}, name: "<white>Jump Potion"}
    - id: utility
      slot: 6
      material: TNT
      name: "<yellow>Utility"
      items:
        - {id: gapple, material: GOLDEN_APPLE, cost: {gold: 3}, name: "<white>Golden Apple"}
        - {id: fireball, material: FIRE_CHARGE, cost: {iron: 40}, name: "<white>Fireball"}
        - {id: tnt, material: TNT, cost: {gold: 4}, name: "<white>TNT"}
        - {id: pearl, material: ENDER_PEARL, cost: {emerald: 4}, name: "<white>Ender Pearl"}
        - {id: water, material: WATER_BUCKET, cost: {gold: 3}, name: "<white>Water Bucket"}
        - {id: sponge, material: SPONGE, amount: 4, cost: {gold: 3}, name: "<white>Sponge"}
        - {id: bridge-egg, material: EGG, special: bridge-egg, cost: {gold: 4}, name: "<white>Bridge Egg", lore: ["<gray>Throw it to build a wool bridge."]}
        - {id: popup-tower, material: CHEST, special: popup-tower, cost: {iron: 24}, name: "<white>Pop-up Tower", lore: ["<gray>Place it to build a ladder tower."]}
        - {id: team-chest, material: CHEST, cost: {iron: 24}, name: "<white>Team Chest", lore: ["<gray>Place it near your spawn.", "<gray>Your whole team shares it."]}
        - {id: ender-chest, material: ENDER_CHEST, cost: {emerald: 1}, name: "<white>Ender Chest", lore: ["<gray>Your own private chest."]}
        - {id: magic-milk, material: MILK_BUCKET, cost: {gold: 4}, name: "<white>Magic Milk", lore: ["<gray>Enemy traps ignore you for 30s."]}
        - {id: dream-defender, material: IRON_GOLEM_SPAWN_EGG, special: dream-defender, cost: {iron: 120}, name: "<white>Dream Defender", lore: ["<gray>An iron golem defends your base."]}
        - {id: lucky, material: SPONGE, lucky-block: true, cost: {emerald: 2}, name: "<yellow>Lucky Block", lore: ["<gray>Only works in blocks you place"]}


upgrades:
  title: "<dark_gray>Team Upgrades"
  trap-radius: 9           
  trap-max: 3              
  trap-costs: [1, 2, 4]     
  traps:
    its-a-trap:
      name: "<red>It's a Trap!"
      target: enemy
      effects:
        - {type: blindness, seconds: 8, amplifier: 0}
        - {type: slowness, seconds: 8, amplifier: 0}
    counter-offensive:
      name: "<green>Counter-Offensive Trap"
      target: team
      effects:
        - {type: speed, seconds: 15, amplifier: 1}
        - {type: jump_boost, seconds: 15, amplifier: 1}
    alarm:
      name: "<yellow>Alarm Trap"
      target: enemy
      reveal: true
    miner-fatigue:
      name: "<gold>Miner Fatigue Trap"
      target: enemy
      effects:
        - {type: mining_fatigue, seconds: 10, amplifier: 0}
  heal-pool-radius: 12
  forge-multipliers: [1.0, 1.5, 2.0, 2.5, 3.0]   
  list:
    sharpness:
      slot: 10
      material: IRON_SWORD
      name: "<yellow>Sharpened Swords"
      lore: ["<gray>Your team permanently gets Sharpness I", "<gray>on all swords.", "", "<white>Level: <green>{level}<gray>/<green>{max}"]
      currency: diamond
      tiers:
        - {cost: 4}
    protection:
      slot: 11
      material: IRON_CHESTPLATE
      name: "<yellow>Reinforced Armor"
      lore: ["<gray>Your team permanently gets Protection", "<gray>on all armor pieces.", "", "<white>Level: <green>{level}<gray>/<green>{max}"]
      currency: diamond
      tiers:
        - {cost: 2}
        - {cost: 4}
        - {cost: 8}
        - {cost: 16}
    forge:
      slot: 12
      material: FURNACE
      name: "<yellow>Iron Forge"
      lore: ["<gray>Upgrade resource spawning on your island.", "", "<white>Level: <green>{level}<gray>/<green>{max}"]
      currency: diamond
      tiers:
        - {cost: 2}
        - {cost: 4}
        - {cost: 6}
        - {cost: 8}
    haste:
      slot: 13
      material: GOLDEN_PICKAXE
      name: "<yellow>Maniac Miner"
      lore: ["<gray>All players on your team permanently", "<gray>gain Haste.", "", "<white>Level: <green>{level}<gray>/<green>{max}"]
      currency: diamond
      tiers:
        - {cost: 2}
        - {cost: 4}
    heal-pool:
      slot: 14
      material: BEACON
      name: "<yellow>Heal Pool"
      lore: ["<gray>Regeneration near your base.", "", "<white>Level: <green>{level}<gray>/<green>{max}"]
      currency: diamond
      tiers:
        - {cost: 1}
    trap-its-a-trap:
      slot: 19
      type: trap
      trap: its-a-trap
      material: TRIPWIRE_HOOK
      name: "<yellow>It's a Trap!"
      lore: ["<gray>The next enemy to enter your base", "<gray>gets Blindness and Slowness."]
      currency: diamond
    trap-counter:
      slot: 20
      type: trap
      trap: counter-offensive
      material: FEATHER
      name: "<yellow>Counter-Offensive Trap"
      lore: ["<gray>Your team gets Speed and Jump Boost", "<gray>when an enemy enters your base."]
      currency: diamond
    trap-alarm:
      slot: 21
      type: trap
      trap: alarm
      material: REDSTONE_TORCH
      name: "<yellow>Alarm Trap"
      lore: ["<gray>Reveals invisible enemies and makes", "<gray>the intruder glow."]
      currency: diamond
    trap-miner-fatigue:
      slot: 22
      type: trap
      trap: miner-fatigue
      material: IRON_PICKAXE
      name: "<yellow>Miner Fatigue Trap"
      lore: ["<gray>The next enemy to enter your base", "<gray>gets Mining Fatigue."]
      currency: diamond
