# ======================================================================================
#  Prison - games/prison.yml
#  Setup: /minigame arena create prison main, stand at the prison spawn -> setlobby, enable.
#  Then for every mine: select the region (/minigame pos1, pos2) and
#  /minigame arena addmine prison main <mine> [requiredRank]
#  Other mine commands: delmine, setminespawn, resetmine, listmines.
# ======================================================================================
# Ranks in order. cost = money for the rank-up, blocks = total blocks the player must have mined.
ranks:
  - {id: A, name: "<gray>A", cost: 0, blocks: 0}
  - {id: B, name: "<green>B", cost: 1500, blocks: 250}
  - {id: C, name: "<aqua>C", cost: 7500, blocks: 1000}
  - {id: D, name: "<blue>D", cost: 25000, blocks: 3000}
  - {id: E, name: "<light_purple>E", cost: 80000, blocks: 8000}
  - {id: F, name: "<gold>F", cost: 250000, blocks: 20000}
  - {id: G, name: "<red>G", cost: 750000, blocks: 50000}
  - {id: FREE, name: "<yellow><bold>FREE", cost: 2500000, blocks: 120000}

tab-rank-prefix: true

# Fallback block table (weights) when a mine has no table below.
default-blocks:
  STONE: 60
  COBBLESTONE: 20
  COAL_ORE: 12
  IRON_ORE: 6
  GOLD_ORE: 2
reset-seconds: 600       # timed reset (0 = off), per mine overridable
reset-percent: 0.25      # reset when this fraction of blocks is left (0 = off)

# Per mine overrides: icon, blocks, reset-seconds, reset-percent
mines:
  a:
    icon: STONE_PICKAXE
    blocks: {STONE: 70, COBBLESTONE: 15, COAL_ORE: 15}
  b:
    icon: IRON_PICKAXE
    blocks: {STONE: 50, COAL_ORE: 20, IRON_ORE: 25, GOLD_ORE: 5}
  c:
    icon: GOLDEN_PICKAXE
    blocks: {STONE: 40, IRON_ORE: 30, GOLD_ORE: 20, LAPIS_ORE: 5, REDSTONE_ORE: 5}
  d:
    icon: DIAMOND_PICKAXE
    blocks: {STONE: 35, GOLD_ORE: 25, REDSTONE_ORE: 15, DIAMOND_ORE: 20, EMERALD_ORE: 5}

# Sell values are per DROPPED item (what the block drops). multiplier-per-rank: +x per rank index.
sell:
  autosell: false
  multiplier-per-rank: 0.05
  values:
    COBBLESTONE: 1
    COAL: 3
    RAW_IRON: 6
    RAW_GOLD: 12
    REDSTONE: 2
    LAPIS_LAZULI: 3
    DIAMOND: 40
    EMERALD: 80

starter-items:
  - {material: STONE_PICKAXE, name: "<gold>Prison Pickaxe", unbreakable: true, enchants: {efficiency: 3}}

mines-menu:
  title: "<dark_gray>Mines"
