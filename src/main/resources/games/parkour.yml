# ======================================================================================
#  Parkour - games/parkour.yml
#  Every enabled arena of the game "parkour" is a course (and a mode in the menu).
#  Setup: /minigame arena create parkour <course>, stand at the start -> setlobby,
#  stand on each checkpoint (in order) -> addcheckpoint, stand on the finish -> setfinish, then enable.
#  Optional: seticon <MATERIAL>, setdifficulty <text>, setdisplayname <text>, setvoid <y>.
#  Checkpoints are detected by block position (place pressure plates there for visuals).
# ======================================================================================
default-icon: LEATHER_BOOTS
require-all-checkpoints: true     # the finish only counts after the last checkpoint
actionbar-timer: true             # shows the live timer in the action bar (task runs only while someone is running)
course-lore:
  - "<gray>Difficulty: <white>{difficulty}"
  - "<gray>Checkpoints: <white>{checkpoints}"
  - ""
  - "<yellow>Click to play!"

# Hotbar items while on a course. action: parkour_reset | parkour_checkpoint | leave
items:
  - {slot: 0, material: LIGHT_WEIGHTED_PRESSURE_PLATE, name: "<yellow>Last Checkpoint <gray>(Right Click)", action: parkour_checkpoint}
  - {slot: 1, material: REPEATER, name: "<red>Restart <gray>(Right Click)", action: parkour_reset}
  - {slot: 8, material: RED_DYE, name: "<red>Leave Course <gray>(Right Click)", action: leave}
