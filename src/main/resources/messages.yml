# ======================================================================================
#  MidnightMinigames - messages.yml
#  MiniMessage (<red>, <bold>, <gradient:...>) and legacy &-codes are supported.
#  {placeholders} are filled in by the plugin; {prefix} inserts the prefix below.
#  Lists are sent as multiple lines. Missing keys fall back to the bundled defaults.
# ======================================================================================
prefix: "<gradient:#7b2ff7:#f107a3><bold>Midnight</bold></gradient> <dark_gray>» <gray>"

state:
  waiting: "Waiting"
  starting: "Starting"
  in_game: "In game"
  ending: "Ending"
  resetting: "Resetting"

placeholders:
  none: "None"

general:
  no-permission: "{prefix}<red>You do not have permission to do that."
  players-only: "{prefix}<red>This command can only be used by players."
  player-not-found: "{prefix}<red>Player <white>{player}<red> was not found."
  unknown-mode: "{prefix}<red>Unknown game mode <white>{mode}<red>."
  not-in-game: "{prefix}<red>You are not in a game."
  to-lobby: "{prefix}<gray>Sent you to the lobby."

join:
  result:
    joined: "{prefix}<green>Joined!"
    no_arena: "{prefix}<red>No arena is available for that mode right now."
    full: "{prefix}<red>All arenas for that mode are full."
    in_progress: "{prefix}<red>That game is already running."
    disabled: "{prefix}<red>{game} is currently disabled."
    already_in_game: "{prefix}<red>You are already in a game. Use <white>/leave<red> first."
    no_permission: "{prefix}<red>You are not allowed to play that game."
    party_too_large: "{prefix}<red>Your party is too large for that mode."
    cancelled: "{prefix}<red>Joining was cancelled."
    error: "{prefix}<red>Could not join. Please tell an admin (see console)."

queue:
  joined: "{prefix}<yellow>No free arena - you were added to the <white>{game} <gray>({mode}<gray>)<yellow> queue. Use <white>/leave<yellow> to cancel."
  left: "{prefix}<gray>You left the queue."
  already: "{prefix}<red>You are already in a queue."

game:
  entered: "{prefix}<green>Welcome to <white>{game}<green>!"
  player-joined: "{prefix}<yellow>{player} <gray>joined <dark_gray>(<green>{current}<gray>/<green>{max}<dark_gray>)"
  player-left: "{prefix}<yellow>{player} <gray>left <dark_gray>(<green>{current}<gray>/<green>{max}<dark_gray>)"
  countdown: "{prefix}<gray>The game starts in <yellow>{seconds}<gray> second(s)."
  countdown-cancelled: "{prefix}<red>Not enough players - countdown cancelled."
  scoreboard-countdown: "<white>Starts in: <green>{seconds}s"
  started: "{prefix}<green><bold>The game has started!"
  now-spectating: "{prefix}<gray>You are now spectating <white>{arena}<gray>. Use <white>/leave<gray> to go back."
  time-up: "{prefix}<red>Time is up!"
  draw: "{prefix}<yellow>The game ended in a draw."
  aborted: "{prefix}<red>The game was stopped by an administrator."
  winner: "{prefix}<gold><bold>Winner: <white>{winners}"
  crashed: "{prefix}<red>The game hit an error and was stopped. An admin was notified in the console."
  team-assigned: "{prefix}<gray>You are on team {team}<gray>."
  team-eliminated: "{prefix}<gray>Team {team}<gray> was <red>eliminated<gray>!"
  command-blocked: "{prefix}<red>You cannot use that command during a game."
  death:
    killed: "{prefix}{player}<gray> was slain by {killer}<gray>."
    generic: "{prefix}{player}<gray> died."
    void: "{prefix}{player}<gray> fell into the void."
    void-killed: "{prefix}{player}<gray> was knocked into the void by {killer}<gray>."
    quit: "{prefix}{player}<gray> left the game."
  reward:
    win: "{prefix}<gold>+{coins} coins <gray>for winning!"
    loss: "{prefix}<gold>+{coins} coins <gray>for playing."
    kill: "{prefix}<gold>+{coins} coins <gray>for a kill."

titles:
  countdown:
    title: "<yellow>{seconds}"
    subtitle: ""
  start:
    title: "<green><bold>GO!"
    subtitle: "<gray>Good luck"
  win:
    title: "<gold><bold>VICTORY!"
    subtitle: "<gray>You won the game"
  lose:
    title: "<red><bold>GAME OVER"
    subtitle: "<gray>Better luck next time"
  draw:
    title: "<yellow><bold>DRAW"
    subtitle: ""
  eliminated:
    title: "<red><bold>ELIMINATED"
    subtitle: "<gray>You are now spectating"
  respawning:
    title: "<red>You died!"
    subtitle: "<gray>Respawning in <yellow>{seconds}"
  bed-destroyed:
    title: "<red><bold>BED DESTROYED!"
    subtitle: "<gray>You will no longer respawn"
  parkour-finish:
    title: "<green><bold>FINISHED!"
    subtitle: "<yellow>{time}"
  oneblock-phase:
    title: "<gold><bold>NEW PHASE"
    subtitle: "{phase}"

party:
  help:
    - "{prefix}<yellow>Party commands:"
    - "<gray>/party create <dark_gray>- <white>create a party"
    - "<gray>/party invite <player> <dark_gray>- <white>invite a player"
    - "<gray>/party accept <dark_gray>- <white>accept an invite"
    - "<gray>/party leave <dark_gray>- <white>leave your party"
    - "<gray>/party disband <dark_gray>- <white>disband (leader)"
    - "<gray>/party kick <player> / list"
  already-in-party: "{prefix}<red>You are already in a party."
  in-game: "{prefix}<red>You cannot create a party while in a game."
  created: "{prefix}<green>Party created. Invite players with <white>/party invite <player><green>. Only the leader can queue."
  not-leader: "{prefix}<red>Only the party leader can do that."
  not-in-party: "{prefix}<red>You are not in a party."
  invite-self: "{prefix}<red>You cannot invite yourself."
  target-in-party: "{prefix}<red>{player} is already in a party."
  target-not-member: "{prefix}<red>{player} is not in your party."
  full: "{prefix}<red>Your party is full (max {max})."
  invite-sent: "{prefix}<green>Invited <white>{player}<green> to your party."
  invite-received: "{prefix}<yellow>{player} invited you to their party. Type <white>/party accept<yellow>."
  no-invite: "{prefix}<red>You have no pending party invite."
  member-joined: "{prefix}<green>{player} joined the party."
  joined: "{prefix}<green>You joined <white>{leader}<green>'s party."
  left: "{prefix}<gray>You left the party."
  member-left: "{prefix}<gray>{player} left the party."
  kicked: "{prefix}<red>You were removed from the party."
  member-kicked: "{prefix}<gray>{player} was removed from the party."
  disbanded: "{prefix}<red>The party was disbanded."
  list: "{prefix}<yellow>Party <gray>({size}/{max}): <white>{members}"
  only-leader-queues: "{prefix}<red>Only the party leader can queue for games."
  member-busy: "{prefix}<red>{player} is busy (in a game or queue) and was left out."

spectate:
  usage: "{prefix}<red>Usage: /spectate <player>"
  not-playing: "{prefix}<red>{player} is not in a game."
  failed: "{prefix}<red>You cannot spectate that game right now."

admin:
  help:
    - "{prefix}<yellow>MidnightMinigames admin commands:"
    - "<gray>/minigame reload"
    - "<gray>/minigame arena create|delete <game> <name>"
    - "<gray>/minigame arena list [game] | info | validate <game> <arena>"
    - "<gray>/minigame arena setspawn <game> <arena> <team>  <dark_gray>(red, blue, green, yellow, aqua, white, pink, gray...)"
    - "<gray>/minigame arena addspawn|clearspawns <game> <arena>"
    - "<gray>/minigame arena setlobby|setspectator|setworld|setmode|setplayers|setcountdown|setgametime|setvoid|setreset|setregion|tp"
    - "<gray>/minigame arena enable|disable <game> <arena>"
    - "<gray>/minigame pos1|pos2  <dark_gray>- select a region (for setregion / addmine / scanchests)"
    - "<gray>/minigame forcestart|stop <game> <arena>"
    - "<gray>/minigame world list|create|load|tp <name>"
    - "<gray>/minigame setlobby|lobby  <dark_gray>- main lobby"
    - "<gray>Game commands: <white>bedwars: setbed addgen addshop<gray>, <white>skywars: addchest scanchests<gray>, <white>parkour: addcheckpoint setfinish<gray>, <white>prison: addmine"
  arena-help: "{prefix}<red>Unknown arena sub command. See <white>/minigame help<red>."
  reloaded: "{prefix}<green>Configuration reloaded."
  usage: "{prefix}<red>Usage: <white>{usage}"
  unknown-game: "{prefix}<red>Unknown game <white>{game}<red>."
  unknown-arena: "{prefix}<red>Arena <white>{arena}<red> does not exist for {game}."
  invalid-name: "{prefix}<red>Names may only contain letters, numbers, - and _ (max 32)."
  invalid-number: "{prefix}<red>Invalid number: <white>{value}"
  arena-exists: "{prefix}<red>Arena <white>{arena}<red> already exists."
  arena-create-failed: "{prefix}<red>Could not create the arena (see console)."
  arena-created: "{prefix}<green>Created arena <white>{arena}<green> for <white>{game}<green> (world: {world}). Next: set spawns, lobby, spectator, then <white>/minigame arena enable<green>."
  arena-deleted: "{prefix}<green>Deleted arena <white>{arena}<green>."
  no-arenas: "{prefix}<gray>No arenas found."
  arena-list-header: "{prefix}<yellow>{count} arena(s):"
  arena-list-entry: "<gray> - <white>{game}/{arena} <dark_gray>[mode {mode}, world {world}] {enabled} <dark_gray>({state})"
  arena-info:
    - "{prefix}<yellow>{game}/{arena}"
    - "<gray>Mode: <white>{mode}  <gray>Enabled: <white>{enabled}  <gray>World: <white>{world}"
    - "<gray>Players: <white>{min}-{max}  <gray>Countdown: <white>{countdown}s  <gray>Game time: <white>{gametime}s"
    - "<gray>Lobby: <white>{lobby}  <gray>Spectator: <white>{spectator}  <gray>Spawns: <white>{spawns}"
    - "<gray>Team spawns: <white>{teams}"
  arena-valid: "{prefix}<green>Arena <white>{arena}<green> is valid and can be enabled."
  arena-invalid: "{prefix}<red>Arena <white>{arena}<red> has problems:"
  problem: "<red> - <gray>{problem}"
  arena-enabled: "{prefix}<green>Arena <white>{arena}<green> enabled."
  arena-disabled: "{prefix}<yellow>Arena <white>{arena}<yellow> disabled."
  spawn-set: "{prefix}<green>Spawn for team <white>{team}<green> set."
  team-not-standard: "{prefix}<yellow>Note: <white>{team}<yellow> is not a standard team colour; BedWars/SkyWars team games ignore it."
  spawn-added: "{prefix}<green>Spawn point added (<white>{count}<green> total)."
  spawns-cleared: "{prefix}<green>All spawn points removed."
  location-set: "{prefix}<green>The {what} location was set to your position."
  world-set: "{prefix}<green>Arena world set to <white>{world}<green>."
  world-missing: "{prefix}<red>World <white>{world}<red> does not exist or is not loaded. Create it with <white>/minigame world create <name><red> or copy the world folder into the server directory."
  mode-set: "{prefix}<green>Arena mode set to <white>{mode}<green>."
  mode-hint: "{prefix}<gray>Hint: this mode normally uses <white>{min}-{max}<gray> players (/minigame arena setplayers)."
  players-set: "{prefix}<green>Players set to <white>{min}-{max}<green>."
  value-set: "{prefix}<green>{key} set to <white>{value}<green>."
  world-copy-hint: "{prefix}<yellow>World-copy reset needs <white>worlds.world-copy-reset.enabled: true<yellow> and a folder <white>world-templates/{world}<yellow>. The live world folder WILL be replaced after every game."
  no-selection: "{prefix}<red>Select a region first with <white>/minigame pos1<red> and <white>/minigame pos2<red> (same world)."
  region-set: "{prefix}<green>Region <white>{key}<green> saved ({volume} blocks)."
  pos-set: "{prefix}<green>{pos} set to <white>{x}, {y}, {z}<green>."
  forcestarted: "{prefix}<green>Force-started <white>{arena}<green>."
  stopped: "{prefix}<green>Stopped <white>{arena}<green>."
  not-running: "{prefix}<red>No game is running or waiting on <white>{arena}<red>."
  lobby-set: "{prefix}<green>Main lobby set to your position."
  lobby-not-set: "{prefix}<red>The main lobby has not been set. Use /minigame setlobby."
  world-help: "{prefix}<yellow>/minigame world <list|create|load|tp> [name]"
  world-list: "{prefix}<yellow>Loaded worlds: <white>{worlds}"
  world-created: "{prefix}<green>Void world <white>{world}<green> created."
  world-failed: "{prefix}<red>Could not create world <white>{world}<red> (see console)."
  world-load-failed: "{prefix}<red>Could not load world <white>{world}<red>: {error}"
  world-loaded: "{prefix}<green>World <white>{world}<green> is loaded."
  stats: "{prefix}<yellow>{player}<gray>: wins <white>{wins}<gray>, losses <white>{losses}<gray>, kills <white>{kills}<gray>, deaths <white>{deaths}<gray>, coins <white>{coins}<gray>, played <white>{played}"
  coins-added: "{prefix}<green>Gave <white>{amount}<green> coins to <white>{player}<green>."

