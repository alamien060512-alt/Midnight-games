    display-name: "<green>1v1"
    spectators: true
    end-delay: 5
    rewards: {win: 15, loss: 1, kill: 0}
    modes:
      quick:
        name: "<green><bold>Quick 1v1"
        material: IRON_SWORD
        slot: 12
        kit: random
        lore:
          - "<gray>A random kit every match."
          - ""
          - "<white>Playing: <green>{players}"
          - "<white>Queued: <yellow>{queued}"
          - ""
          - "<yellow>Click to queue!"
