    enabled: true
    display-name: "<light_purple>SkyGen"
    pvp: false
    modes:
      play:
        name: "<light_purple><bold>Your Generators"
        material: BEACON
        slot: 13
        lore:
          - "<gray>Place generators, mine, prestige."
          - ""
          - "<white>Players: <green>{players}"
          - "<yellow>Click to enter!"
