  parkour:
    enabled: true
    display-name: "<green>Parkour"
    rewards: {finish: 10}
    # modes are generated from the enabled parkour arenas (courses)
  oneblock:
    enabled: true
    display-name: "<yellow>OneBlock"
    pvp: false
    modes:
      play:
        name: "<yellow><bold>Your OneBlock"
        material: GRASS_BLOCK
        slot: 13
        lore:
