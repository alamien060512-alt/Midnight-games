        name: "<gold><bold>Classic 1v1"
        material: DIAMOND_SWORD
        slot: 14
        kit: classic
        lore:
          - "<gray>The Classic kit."
          - ""
          - "<white>Playing: <green>{players}"
          - "<white>Queued: <yellow>{queued}"
          - ""
          - "<yellow>Click to queue!"
  prison:
    enabled: true
    display-name: "<gold>Prison"
    pvp: false
    modes:
      play:
        name: "<gold><bold>Enter Prison"
        material: IRON_BARS
        slot: 13
        lore:
          - "<gray>Mine, sell and rank up."
          - ""
          - "<white>Players: <green>{players}"
          - "<yellow>Click to enter!"
  skyblock:
    enabled: true
    display-name: "<green>Skyblock"
    pvp: false
    modes:
      play:
        name: "<green><bold>Your Island"
        material: GRASS_BLOCK
        slot: 13
        lore:
          - "<gray>Build your island in the sky."
          - ""
          - "<white>Players: <green>{players}"
